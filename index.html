<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>From one sample to the population: a CLT demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F6F7F9; --surface:#FFFFFF; --ink:#18202E; --muted:#5B6676; --rule:#DDE2E8;
  --pop:#9AA6B6; --sample:#C97E0A; --mean:#1F6F8B; --miss:#C23B22; --hit:#1F6F8B;
  color-scheme: light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#10151E; --surface:#171E2A; --ink:#E9EDF3; --muted:#9AA6B6; --rule:#2A3342;
    --pop:#56637A; --sample:#F2A93B; --mean:#5BB8D6; --miss:#FF7A5C; --hit:#5BB8D6;
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#10151E; --surface:#171E2A; --ink:#E9EDF3; --muted:#9AA6B6; --rule:#2A3342;
  --pop:#56637A; --sample:#F2A93B; --mean:#5BB8D6; --miss:#FF7A5C; --hit:#5BB8D6;
  color-scheme: dark;
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px); height:100%}
body{margin:0; min-height:100%; background:var(--bg); color:var(--ink);
  font-family:"Atkinson Hyperlegible Next","Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  font-size:18px; line-height:1.4; font-variant-numeric:tabular-nums;}
.app{max-width:1500px; margin:0 auto; padding:18px 28px 22px; display:flex; flex-direction:column; gap:14px; min-height:100vh}
nav.steps{display:flex; gap:6px; flex-wrap:wrap; align-items:center}
nav.steps button{font:inherit; font-size:17px; border:0; background:transparent; color:var(--muted);
  padding:8px 14px 8px 10px; border-radius:999px; cursor:pointer; display:flex; gap:8px; align-items:center}
nav.steps button .num{display:inline-grid; place-items:center; width:26px; height:26px; border-radius:50%;
  border:2px solid currentColor; font-weight:800; font-size:14px}
nav.steps button[aria-current="step"]{color:var(--ink); background:var(--surface); box-shadow:0 0 0 1px var(--rule)}
nav.steps button[aria-current="step"] .num{background:var(--ink); color:var(--bg); border-color:var(--ink)}
nav.steps .spacer{flex:1}
.hint{color:var(--muted); font-size:14px}
kbd{font:inherit; font-size:13px; border:1px solid var(--rule); border-bottom-width:2px; border-radius:5px; padding:0 5px; background:var(--surface)}
header.story h1{font-size:clamp(26px,2.8vw,42px); line-height:1.12; margin:4px 0 6px; font-weight:800; letter-spacing:-0.01em; max-width:30ch}
header.story p{margin:0; color:var(--muted); font-size:clamp(17px,1.35vw,21px); max-width:72ch}
.main{display:grid; grid-template-columns:1fr 260px; gap:18px; flex:1; min-height:0}
.charts{display:grid; gap:14px; min-height:420px}
.charts.s1{grid-template-columns:1fr; grid-template-rows:1fr}
.charts.s2{grid-template-columns:1fr 1fr; grid-template-rows:1fr}
.charts.s3,.charts.s4{grid-template-columns:1fr; grid-template-rows:minmax(150px,1fr) minmax(150px,1fr) minmax(240px,1.6fr)}
.charts.s5{grid-template-columns:1fr 1fr; grid-template-rows:170px 1fr}
.panel{background:var(--surface); border:1px solid var(--rule); border-radius:12px; padding:12px 14px 8px; display:flex; flex-direction:column; min-height:0}
.panel h2{font-size:16px; margin:0 0 4px; font-weight:600; color:var(--muted)}
.panel h2 b{color:var(--ink)}
.panel .plot{flex:1; min-height:120px; position:relative}
.panel svg{position:absolute; inset:0; width:100%; height:100%; overflow:visible}
.wide{grid-column:1 / -1}
.hidden{display:none !important}
aside.rail{display:flex; flex-direction:column; gap:10px}
.stat{background:var(--surface); border:1px solid var(--rule); border-radius:12px; padding:10px 14px}
.stat .k{font-size:14px; color:var(--muted)}
.stat .v{font-size:28px; font-weight:800; line-height:1.15}
.stat .v small{font-size:15px; font-weight:400; color:var(--muted)}
.stat.sample .v{color:var(--sample)} .stat.mean .v{color:var(--mean)}
.note{font-size:14px; color:var(--muted); padding:0 4px}
.controls{display:flex; flex-wrap:wrap; gap:10px 18px; align-items:center}
.group{display:flex; gap:6px; align-items:center; flex-wrap:wrap}
.group > span{font-size:15px; color:var(--muted); margin-right:2px}
button.b{font:inherit; font-size:17px; padding:9px 16px; border-radius:10px; border:1px solid var(--rule); background:var(--surface); color:var(--ink); cursor:pointer; display:inline-flex; gap:8px; align-items:center}
button.b.primary{background:var(--ink); color:var(--bg); border-color:var(--ink); font-weight:600}
button.b.primary kbd{background:transparent; color:inherit; border-color:currentColor; opacity:.7}
.seg{display:inline-flex; border:1px solid var(--rule); border-radius:10px; overflow:hidden; background:var(--surface)}
.seg button{font:inherit; font-size:16px; padding:8px 13px; border:0; background:transparent; color:var(--ink); cursor:pointer}
.seg button+button{border-left:1px solid var(--rule)}
.seg button[aria-pressed="true"]{background:var(--ink); color:var(--bg); font-weight:600}
button:focus-visible{outline:3px solid var(--sample); outline-offset:2px}
svg text{fill:var(--muted); font-family:inherit; font-size:14px}
svg .axis{stroke:var(--muted); opacity:.6}
svg .grid{stroke:var(--rule)}
svg .bar-pop{fill:var(--pop)}
svg .bar-sample{fill:var(--sample)}
svg .bar-mean{fill:var(--mean); opacity:.8}
svg .bar-mean.fresh{fill:var(--sample); opacity:1}
svg .curve{fill:none; stroke:var(--ink); stroke-width:2.5}
svg .mu{stroke:var(--ink); stroke-width:2; stroke-dasharray:6 5}
svg .xbar{stroke:var(--ink); stroke-width:3}
svg .lbl-ink{fill:var(--ink); font-weight:600}
svg .lbl-sample{fill:var(--sample); font-weight:800}
svg .iv{stroke-width:3; stroke-linecap:round}
svg .iv.hit{stroke:var(--hit); opacity:.55}
svg .iv.miss{stroke:var(--miss)}
svg .iv.newest{opacity:1; stroke-width:6}
.empty{position:absolute; inset:0; display:grid; place-items:center; color:var(--muted); font-size:18px; text-align:center; padding:20px}
@media (max-width:900px){
  .main{grid-template-columns:1fr}
  .charts.s2,.charts.s3,.charts.s4,.charts.s5{grid-template-columns:1fr; grid-template-rows:none}
  .panel{min-height:240px}
  aside.rail{display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
}
@media (prefers-reduced-motion: no-preference){
  svg .bar-mean{transition:fill .6s}
}
</style>
</head>
<body>
<div class="app">
  <nav class="steps" aria-label="Steps">
    <button data-step="1"><span class="num">1</span>The population</button>
    <button data-step="2"><span class="num">2</span>One sample</button>
    <button data-step="3"><span class="num">3</span>Many sample means</button>

    <button data-step="5"><span class="num">5</span>Back to one sample</button>

  </nav>

  <header class="story" aria-live="polite">
    <h1 id="headline"></h1>
    <p id="sub"></p>
  </header>

  <div class="main">
    <div class="charts s1" id="charts">
      <section class="panel" id="p-pop"><h2 id="t-pop"></h2><div class="plot" id="plot-pop"></div></section>
      <section class="panel" id="p-sample"><h2 id="t-sample"></h2><div class="plot" id="plot-sample"></div></section>
      <section class="panel wide" id="p-means"><h2 id="t-means"></h2><div class="plot" id="plot-means"></div></section>
      <section class="panel wide" id="p-iv"><h2 id="t-iv"></h2><div class="plot" id="plot-iv"></div></section>
    </div>
    <aside class="rail" id="rail" aria-live="polite"></aside>
  </div>

  <div class="controls">
    <div class="group"><span>Population</span>
      <div class="seg" id="seg-pop">
        <button data-pop="inc">Income</button>
        <button data-pop="age">Age</button>
        <button data-pop="educ">Education</button>
      </div>
    </div>
    <div class="group"><span>Sample size n</span>
      <div class="seg" id="seg-n">
        <button data-n="5">5</button><button data-n="10">10</button><button data-n="30">30</button><button data-n="100">100</button><button data-n="400">400</button>
      </div>
    </div>
    <div class="group" id="draw-group">
      <button class="b primary" id="btn-one">Draw one sample <kbd>Space</kbd></button>
      <button class="b" id="btn-100">Draw 100</button>
      <button class="b" id="btn-1000">Draw 1,000</button>
      <button class="b" id="btn-reset">Reset</button>
    </div>
    <div class="group" id="means-opts">
      <span>Normal curve</span>
      <div class="seg" id="seg-curve"><button data-curve="0">Off</button><button data-curve="1">On</button></div>
      <span>Scale</span>
      <div class="seg" id="seg-zoom"><button data-zoom="0">Same as population</button><button data-zoom="1">Zoom in</button></div>
    </div>
    <div class="group" id="iv-opts"><span>Interval uses</span>
      <div class="seg" id="seg-method"><button data-method="z" aria-pressed="false">z (1.96)</button><button data-method="t" aria-pressed="true">t</button></div>
    </div>
  </div>
</div>

         `For large enough n, sample means are approximately normal no matter what the population looks like, centered on μ, with spread SE = σ/√n = ${p.seFmt(SE())}. Try n = 5: the means are still a bit skewed. Larger n fixes that.`],
      5:['In real life you get one sample, so you get one interval.',
         `x̄ ± ${S.method==='t'?'t':'1.96'} × s/√n. We can’t use σ (we don’t know it), so we estimate the SE from the sample itself. Draw lots of intervals and count how often they catch μ. ${S.method==='z'?'Try n = 5 with z: it misses too often. Then switch to t.':'Switch to z at n = 5 to see what t is protecting you from.'}`]
    };
    document.getElementById('headline').textContent=T[S.step][0];
    document.getElementById('sub').textContent=T[S.step][1];
  }

  // ---------- Stats rail ----------
  function rail(){
    const p=P(),L=S.last,out=[],f=p.fmt;
    const stat=(k,v,cls='',small='')=>out.push(`<div class="stat ${cls}"><div class="k">${k}</div><div class="v">${v}${small?` <small>${small}</small>`:''}</div></div>`);
    stat('Population mean μ',f(p.mu),'',p.unit);
    stat('Population SD σ',f(p.sd));
    if(S.step>=2){
      stat('Your sample mean x̄',L?f(L.m):'–','sample');
      stat('Your sample SD s',L?f(L.s):'–','sample');
    }
    if(S.step===3||S.step===4){
      const k=S.means.length;let sd='–',mm='–';
      if(k>0){const m=S.means.reduce((a,b)=>a+b,0)/k;mm=f(m);
        if(k>1)sd=p.seFmt(Math.sqrt(S.means.reduce((a,b)=>a+(b-m)**2,0)/(k-1)))}
      if(S.step===3)stat('Average of the means we drew',mm,'mean',`from ${k.toLocaleString()} samples`);
      if(S.step===4)stat('CLT says SE = σ/√n',p.seFmt(SE()),'mean');
      stat('SD of the means we drew',sd,'mean',`from ${k.toLocaleString()} samples`);
    }
    if(S.step===5){
      stat('Estimated SE = s/√n',L?p.seFmt(L.s/Math.sqrt(S.n)):'–','sample');
      const k=S.ivs.length,h=S.ivs.filter(v=>v.hit).length;
      stat('Intervals that caught μ',k?`${Math.round(100*h/k)}%`:'–','mean',k?`${h.toLocaleString()} of ${k.toLocaleString()}; promised 95%`:'promised 95%');
    }
    document.getElementById('rail').innerHTML=out.join('')+
      (S.step===5?`<p class="note">μ is shown here only because this is a simulation. In real research it’s the thing you’re trying to find.</p>`:'');
  }

  // ---------- Chart helpers ----------
  const NS='http://www.w3.org/2000/svg';
  function canvas(id){
    const el=document.getElementById(id);el.innerHTML='';
    const r=el.getBoundingClientRect(),w=Math.max(r.width,200),h=Math.max(r.height,100);
    const svg=document.createElementNS(NS,'svg');svg.setAttribute('viewBox',`0 0 ${w} ${h}`);
    el.appendChild(svg);return {el,svg,w,h,m:{l:66,r:16,t:30,b:30}};
  }
  function add(svg,tag,attrs,text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!=null)e.textContent=text;svg.appendChild(e);return e}
  function niceStep(range,count){const raw=range/count,p=Math.pow(10,Math.floor(Math.log10(raw))),f=raw/p;return (f<1.5?1:f<3?2:f<7?5:10)*p}
  function xAxis(c,lo,hi,X,count,fmt){
    const y=c.h-c.m.b;add(c.svg,'line',{x1:c.m.l,x2:c.w-c.m.r,y1:y,y2:y,class:'axis'});
    const st=niceStep(hi-lo,count),dec=st<1?(st<0.1?2:1):0;
    for(let v=Math.ceil(lo/st)*st;v<=hi+1e-9;v+=st){add(c.svg,'text',{x:X(v),y:y+20,'text-anchor':'middle'},fmt?fmt(v):v.toFixed(dec))}
  }
  function yAxis(c,max,title,f,integer){
    const nt=Math.max(2,Math.min(5,Math.floor((c.h-c.m.t-c.m.b)/28)));
    let st=niceStep(Math.max(max,1e-9),nt);if(integer)st=Math.max(1,Math.round(st));
    const top=Math.max(st,Math.ceil(max/st-1e-9)*st);
    const Y=v=>c.h-c.m.b-v/top*(c.h-c.m.t-c.m.b);
    for(let v=0;v<=top+1e-9;v+=st){const y=Y(v);
      if(v>0)add(c.svg,'line',{x1:c.m.l,x2:c.w-c.m.r,y1:y,y2:y,class:'grid'});
      add(c.svg,'text',{x:c.m.l-8,y:y+5,'text-anchor':'end'},f(v))}
    add(c.svg,'line',{x1:c.m.l,x2:c.m.l,y1:c.m.t,y2:c.h-c.m.b,class:'axis'});
    add(c.svg,'text',{x:0,y:0,'text-anchor':'middle',transform:`translate(16,${(c.m.t+c.h-c.m.b)/2}) rotate(-90)`},title);
    return Y;
  }
  function empty(id,msg){document.getElementById(id).innerHTML=`<div class="empty">${msg}</div>`}
  function bars(c,bins,lo,bw,X,Y,cls){
    bins.forEach((v,i)=>{if(!v)return;const x0=X(lo+i*bw),x1=X(lo+(i+1)*bw),y=Y(v);
      add(c.svg,'rect',{x:x0+0.5,y,width:Math.max(1,x1-x0-1),height:c.h-c.m.b-y,class:cls})});
  }
  const pct=v=>{const r=Math.round(v*1000)/10;return (Number.isInteger(r)?r:r.toFixed(1))+'%'};
  function fullX(c){const p=P();return v=>c.m.l+(v-p.lo)/(p.hi-p.lo)*(c.w-c.m.l-c.m.r)}
  function xTicks(){return S.pop==='inc'?10:12}

  // ---------- Charts ----------
  function chartPop(){
    const c=canvas('plot-pop'),p=P(),b=p.bins(),X=fullX(c);
    const Y=yAxis(c,Math.max(...b),P().yLabel||'% of people',pct);
    bars(c,b,p.lo,p.bw,X,Y,'bar-pop');
    xAxis(c,Math.max(0,p.lo),p.hi,X,xTicks(),p.tick);
    add(c.svg,'line',{x1:X(p.mu),x2:X(p.mu),y1:c.m.t-4,y2:c.h-c.m.b,class:'mu'});
    add(c.svg,'text',{x:X(p.mu)+6,y:c.m.t-12,class:'lbl-ink'},`μ = ${p.fmt(p.mu)}`);
    if(S.step===1){
      const sk=p.skew, word=sk>0.5?'skewed right':sk<-0.5?'skewed left':'roughly symmetric';
      add(c.svg,'text',{x:c.w-c.m.r,y:c.m.t-12,'text-anchor':'end',class:'lbl-ink',style:'font-size:18px'},`Skewness = ${sk.toFixed(2)} (${word})`);
    }
    document.getElementById('t-pop').innerHTML=p.title;
  }
  function chartSample(){
    document.getElementById('t-sample').innerHTML=`Your latest sample: <b>n = ${S.n}</b>`;
    if(!S.last){empty('plot-sample','Press <b>Draw one sample</b> or the space bar.');return}
    const c=canvas('plot-sample'),p=P(),X=fullX(c),nb=Math.round((p.hi-p.lo)/p.bw),b=new Array(nb).fill(0);
    S.last.xs.forEach(v=>{b[Math.min(nb-1,Math.floor((v-p.lo)/p.bw))]+=1/S.n});
    const Y=yAxis(c,Math.max(...b),P().yLabel||'% of people',pct);
    bars(c,b,p.lo,p.bw,X,Y,'bar-sample');
    xAxis(c,Math.max(0,p.lo),p.hi,X,xTicks(),p.tick);
    const xm=X(S.last.m);
    add(c.svg,'line',{x1:xm,x2:xm,y1:c.m.t-4,y2:c.h-c.m.b,class:'xbar'});
    add(c.svg,'text',{x:xm+6,y:c.m.t-12,class:'lbl-sample'},`x̄ = ${p.fmt(S.last.m)}`);
  }
  function domain(){
    const p=P();
    if(!S.zoom&&(S.step===3||S.step===4))return [p.lo,p.hi];
    return [p.mu-4.5*SE(),p.mu+4.5*SE()];
  }
  function chartMeans(){
    const k=S.means.length;
    document.getElementById('t-means').innerHTML=`Sample means: <b>${k.toLocaleString()} samples</b> of n = ${S.n} so far`;
    if(!k){empty('plot-means','Each sample you draw adds its mean here.');return}
    const c=canvas('plot-means'),p=P(),[lo,hi]=domain();
    // whole-number data put means on a lattice of 1/n; align bins to it to avoid striping
    let bw=(hi-lo)/(S.zoom?44:96),start=lo;
    if(p.lattice){bw=Math.max(1,Math.round(bw*S.n))/S.n;start=Math.floor(lo*S.n)/S.n-0.5/S.n}
    const nb=Math.ceil((hi-start)/bw),b=new Array(nb).fill(0);
    S.means.forEach(m=>{const i=Math.floor((m-start)/bw);if(i>=0&&i<nb)b[i]++});
    const freshBin=S.fresh!=null?Math.floor((S.fresh-start)/bw):-1;
    const X=v=>c.m.l+(v-lo)/(hi-lo)*(c.w-c.m.l-c.m.r);
    const peak=k*bw*npdf(p.mu,p.mu,SE());
    const curveOn=S.curve;
    const Y=yAxis(c,Math.max(...b,curveOn?peak:0),'samples',v=>v.toLocaleString(),true);
    b.forEach((v,i)=>{if(!v)return;const a=start+i*bw;if(a+bw<lo||a>hi)return;const x0=X(Math.max(lo,a)),x1=X(Math.min(hi,a+bw)),y=Y(v);
      add(c.svg,'rect',{x:x0+0.5,y,width:Math.max(1,x1-x0-1),height:c.h-c.m.b-y,class:'bar-mean'+(i===freshBin?' fresh':'')})});
    if(curveOn){
      let d='';for(let j=0;j<=240;j++){const x=lo+(hi-lo)*j/240;d+=(j?'L':'M')+X(x).toFixed(1)+','+Y(k*bw*npdf(x,p.mu,SE())).toFixed(1)}
      add(c.svg,'path',{d,class:'curve'});
    }
    const zoomed=S.zoom;
    xAxis(c,zoomed?lo:Math.max(0,lo),hi,X,zoomed?9:xTicks(),zoomed?(S.pop==='inc'?usdK:null):p.tick);
    add(c.svg,'line',{x1:X(p.mu),x2:X(p.mu),y1:c.m.t-4,y2:c.h-c.m.b,class:'mu'});
    add(c.svg,'text',{x:X(p.mu)+6,y:c.m.t-12,class:'lbl-ink'},'μ');
    if(S.fresh!=null)add(c.svg,'text',{x:X(S.fresh),y:c.h-c.m.b-6,'text-anchor':'middle',class:'lbl-sample'},'▲');
  }
  function chartIv(){
    const k=S.ivs.length,show=Math.min(k,40);
    document.getElementById('t-iv').innerHTML=`Confidence intervals: <b>newest at the top</b>, showing ${show} of ${k.toLocaleString()}`;
    if(!k){empty('plot-iv','Draw a sample to build your interval.');return}
    const c=canvas('plot-iv'),p=P();
    const lo=p.mu-6*SE(),hi=p.mu+6*SE();
    const X=v=>c.m.l+(Math.max(lo,Math.min(hi,v))-lo)/(hi-lo)*(c.w-c.m.l-c.m.r);
    const rows=S.ivs.slice(-show).reverse(),rh=(c.h-c.m.t-c.m.b-8)/40;
    add(c.svg,'line',{x1:X(p.mu),x2:X(p.mu),y1:c.m.t-4,y2:c.h-c.m.b,class:'mu'});
    add(c.svg,'text',{x:X(p.mu)+6,y:c.m.t-12,class:'lbl-ink'},'μ');
    rows.forEach((iv,i)=>{
      const y=c.m.t+10+i*rh+rh/2;
      add(c.svg,'line',{x1:X(iv.lo),x2:X(iv.hi),y1:y,y2:y,class:'iv '+(iv.hit?'hit':'miss')+(i===0?' newest':'')});
      if(i===0){
        add(c.svg,'circle',{cx:X(iv.m),cy:y,r:7,fill:'var(--sample)'});
        const right=X(iv.hi)+10,fits=right<c.w-150;
        add(c.svg,'text',{x:fits?right:X(iv.lo)-10,y:y+5,'text-anchor':fits?'start':'end',class:'lbl-sample'},iv.hit?'yours: caught μ':'yours: missed μ');
      }
    });
    xAxis(c,lo,hi,X,10,S.pop==='inc'?usdK:null);
  }

  // ---------- Render ----------
  function render(){
    document.getElementById('charts').className='charts s'+S.step;
    document.getElementById('p-sample').classList.toggle('hidden',S.step<2);
    document.getElementById('p-means').classList.toggle('hidden',!(S.step===3||S.step===4));
    document.getElementById('p-iv').classList.toggle('hidden',S.step!==5);
    document.getElementById('draw-group').classList.toggle('hidden',S.step<2);
    document.getElementById('means-opts').classList.toggle('hidden',!(S.step===3||S.step===4));
    document.getElementById('iv-opts').classList.toggle('hidden',S.step!==5);
    document.querySelectorAll('nav.steps button').forEach(b=>b.removeAttribute('aria-current'));
    const cur=document.querySelector(`nav.steps button[data-step="${S.step}"]`);if(cur)cur.setAttribute('aria-current','step');
    document.getElementById('btn-one').firstChild.textContent=S.step===5?'Draw one interval ':'Draw one sample ';
    document.querySelectorAll('#seg-n button').forEach(b=>b.setAttribute('aria-pressed',+b.dataset.n===S.n));
    document.querySelectorAll('#seg-pop button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.pop===S.pop));
    document.querySelectorAll('#seg-method button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.method===S.method));
    document.querySelectorAll('#seg-curve button').forEach(b=>b.setAttribute('aria-pressed',(b.dataset.curve==='1')===S.curve));
    document.querySelectorAll('#seg-zoom button').forEach(b=>b.setAttribute('aria-pressed',(b.dataset.zoom==='1')===S.zoom));
    document.querySelector('#seg-method [data-method="t"]').textContent=`t (${TCRIT[S.n]})`;
    story();rail();
    requestAnimationFrame(()=>{
      chartPop();
      if(S.step>=2)chartSample();
      if(S.step===3||S.step===4)chartMeans();
      if(S.step===5)chartIv();
    });
  }
  const LAST=Math.max(3,Math.min(5,parseInt(new URLSearchParams(location.search).get('steps'))||3));
  document.querySelectorAll('nav.steps button').forEach(b=>{if(+b.dataset.step>LAST)b.remove()});
  const go=s=>{S.step=Math.max(1,Math.min(LAST,s));S.fresh=null;render()};

  // ---------- Events ----------
  document.querySelectorAll('nav.steps button').forEach(b=>b.onclick=()=>go(+b.dataset.step));
  document.querySelectorAll('#seg-n button').forEach(b=>b.onclick=()=>{S.n=+b.dataset.n;reset()});
  document.querySelectorAll('#seg-pop button').forEach(b=>b.onclick=()=>{S.pop=b.dataset.pop;reset()});
  document.querySelectorAll('#seg-method button').forEach(b=>b.onclick=()=>{S.method=b.dataset.method;S.ivs=[];render()});
  document.querySelectorAll('#seg-curve button').forEach(b=>b.onclick=()=>{S.curve=b.dataset.curve==='1';render()});
  document.querySelectorAll('#seg-zoom button').forEach(b=>b.onclick=()=>{S.zoom=b.dataset.zoom==='1';render()});
  document.getElementById('btn-one').onclick=()=>draw(1);
  document.getElementById('btn-100').onclick=()=>draw(100);
  document.getElementById('btn-1000').onclick=()=>draw(1000);
  document.getElementById('btn-reset').onclick=reset;
  document.addEventListener('keydown',e=>{
    if(e.metaKey||e.ctrlKey||e.altKey)return;
    if(e.key==='ArrowRight'){go(S.step+1);e.preventDefault()}
    else if(e.key==='ArrowLeft'){go(S.step-1);e.preventDefault()}
    else if(['1','2','3','4','5'].includes(e.key))go(+e.key);
    else if(e.key===' '&&S.step>=2){draw(1);e.preventDefault()}
    else if((e.key==='m'||e.key==='M')&&S.step>=2)draw(100);
    else if(e.key==='r'||e.key==='R')reset();
  });
  let rt;window.addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(render,120)});
  render();
})();
</script>
</body>
</html>
